name: Reusable Security PR Gate

on:
  workflow_call:
    inputs:
      dependency-review:
        description: "Run GitHub Dependency & License Review on pull requests"
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download and verify Gitleaks
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail

          gh release download "v${GITLEAKS_VERSION}" \
            --repo gitleaks/gitleaks \
            --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --pattern "gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            --dir "${RUNNER_TEMP}"

          (
            cd "${RUNNER_TEMP}"
            grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
            tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          )

      - name: Scan commits for secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          CONFIG_ARGS=()
          if [[ -f ".gitleaks.toml" ]]; then
            CONFIG_ARGS=(--config ".gitleaks.toml")
          fi

          if [[ "${EVENT_NAME}" == "pull_request" && -n "${BASE_SHA}" && -n "${HEAD_SHA}" ]]; then
            LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
          else
            LOG_OPTS="-1"
          fi

          "${RUNNER_TEMP}/gitleaks" git \
            --log-opts="${LOG_OPTS}" \
            --redact=100 \
            --verbose \
            --no-banner \
            "${CONFIG_ARGS[@]}" \
            .

  dependency-review:
    name: Dependency & license review
    if: ${{ inputs.dependency-review && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check dependencies and licenses
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
