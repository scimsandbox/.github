name: Reusable Security PR Gate

on:
  workflow_call:
    inputs:
      dependency-review:
        description: "Run GitHub Dependency & License Review on pull requests (public repos only)"
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: security-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          filter: blob:none

      - name: Fetch PR commit range
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags --filter=blob:none --shallow-exclude="refs/heads/${BASE_REF}" origin "${HEAD_SHA}"
          git fetch --no-tags --filter=blob:none --depth=2 origin "${BASE_SHA}"

          if ! git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}" 2>/dev/null; then
            git fetch --no-tags --filter=blob:none --unshallow origin
          fi

      - name: Download and verify Gitleaks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Manual pin (not tracked by Dependabot github-actions); bump periodically alongside gitleaks releases.
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail

          gh release download "v${GITLEAKS_VERSION}" \
            --repo gitleaks/gitleaks \
            --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --pattern "gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            --dir "${RUNNER_TEMP}"

          (
            cd "${RUNNER_TEMP}"
            grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
            tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          )

      - name: Scan commits for secrets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          CONFIG_ARGS=()
          if [[ -f ".gitleaks.toml" ]]; then
            CONFIG_ARGS=(--config ".gitleaks.toml")
          fi

          if [[ "${EVENT_NAME}" == "pull_request" && -n "${BASE_SHA}" && -n "${HEAD_SHA}" ]]; then
            LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
          elif [[ "${EVENT_NAME}" == "push" && -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            LOG_OPTS="${BEFORE_SHA}..${AFTER_SHA}"
          else
            LOG_OPTS="--all"
          fi

          "${RUNNER_TEMP}/gitleaks" git \
            --log-opts="${LOG_OPTS}" \
            --redact=100 \
            --verbose \
            --no-banner \
            "${CONFIG_ARGS[@]}" \
            .

  dependency-review:
    name: Dependency & license review
    # Dependency Review requires Dependency Graph + Code Security on private repos; runs automatically on public repos.
    if: ${{ inputs.dependency-review && github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check dependencies and licenses
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0
