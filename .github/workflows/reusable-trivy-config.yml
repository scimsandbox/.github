name: Reusable Trivy Config Scan

on:
  workflow_call:
    inputs:
      scan-ref:
        description: "Directory or file path to scan for IaC/Dockerfile misconfigurations"
        required: false
        type: string
        default: "."
      upload-sarif:
        description: "Upload SARIF report to GitHub Code Scanning"
        required: false
        type: boolean
        default: true

permissions: {}

jobs:
  trivy-config:
    name: Trivy IaC & config scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Generate Trivy config SARIF report
        if: ${{ inputs.upload-sarif }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.scan-ref }}
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy config SARIF to GitHub Security
        if: ${{ always() && inputs.upload-sarif && hashFiles('trivy-config.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

      - name: Enforce Trivy config gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.scan-ref }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
