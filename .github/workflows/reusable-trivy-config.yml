name: Reusable Trivy Config Scan

on:
  workflow_call:
    inputs:
      scan-ref:
        description: "Directory or file path to scan for IaC/Dockerfile misconfigurations"
        required: false
        type: string
        default: "."
      severity:
        description: "Comma-separated Trivy severities to report and enforce"
        required: false
        type: string
        default: "CRITICAL,HIGH"
      trivyignores:
        description: "Optional comma-separated path(s) to .trivyignore file(s)"
        required: false
        type: string
        default: ""
      upload-sarif:
        description: "Upload SARIF report to GitHub Code Scanning when supported"
        required: false
        type: boolean
        default: true
      category:
        description: "SARIF category identifier (override when running multiple config scans per repo)"
        required: false
        type: string
        default: "trivy-config"

permissions: {}

concurrency:
  group: trivy-config-${{ github.workflow }}-${{ inputs.category }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy-config:
    name: Trivy IaC & config scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Trivy config SARIF report
        id: sarif
        if: >-
          inputs.upload-sarif &&
          !github.event.repository.private &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.scan-ref }}
          format: sarif
          output: trivy-config.sarif
          severity: ${{ inputs.severity }}
          trivyignores: ${{ inputs.trivyignores }}

      - name: Upload Trivy config SARIF to GitHub Security
        continue-on-error: true
        if: >-
          always() &&
          steps.sarif.outcome == 'success' &&
          hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-config.sarif
          category: ${{ inputs.category }}

      - name: Enforce Trivy config gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ inputs.scan-ref }}
          format: table
          exit-code: "1"
          severity: ${{ inputs.severity }}
          trivyignores: ${{ inputs.trivyignores }}
          skip-setup-trivy: ${{ steps.sarif.outcome == 'success' }}
